### NMS POC TLS gateway - nginx
### SECURITY-CRITICAL (design 12.4): this proxy is the ONLY boundary in front of
### LibreNMS on the 0.4c branch (no host firewall is available without root).
### Two properties must hold, and both are negative-tested at Task 0.6 Step 9:
###   1. Client-supplied identity headers are STRIPPED, never forwarded.
###   2. /api/ is NOT redirected to the IdP (the BFF authenticates by token).

worker_processes 2;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Aardvark (Podman's container DNS) - resolve upstreams AT REQUEST TIME.
  # Without this, nginx resolves each upstream ONCE at startup and caches the IP
  # forever: restarting LibreNMS gives it a new container IP and every request then
  # 502s while the service is perfectly healthy. Variable proxy_pass targets force
  # re-resolution. This is a correctness fix, not a tuning knob.
  resolver 10.89.0.1 valid=10s ipv6=off;
  resolver_timeout 5s;

  client_max_body_size 16m;
  server_tokens off;
  gzip on;
  gzip_types application/json text/css application/javascript;

  # HTTP 8080 -> redirect to HTTPS 8443
  server {
    listen 8080;
    return 301 https://$host:8443$request_uri;
  }

  server {
    listen 8443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/tls/nms.crt;
    ssl_certificate_key /etc/nginx/tls/nms.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Keycloak (POC IdP), reached only through this gateway ----
    location /auth/ {
      set $kc_upstream nms-keycloak;
      proxy_pass http://$kc_upstream:8081$request_uri;
      proxy_set_header Host              $host:8443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port  8443;
      proxy_set_header X-Forwarded-For   $remote_addr;
      proxy_set_header X-Forwarded-Host  $host:8443;
    }

    # ---- LibreNMS REST API: token-authenticated, NEVER redirected to the IdP ----
    # A 302 here would break the BFF (Task 0.6 Step 3 asserts 401, not 302).
    location /api/ {
      set $ln_upstream nms-librenms;
      proxy_pass http://$ln_upstream:8000$request_uri;
      proxy_set_header Host $host:8443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      # STRIP client-supplied identity headers - a forged X-Remote-User must never
      # reach LibreNMS. Empty string = header not sent upstream.
      proxy_set_header X-Remote-User "";
      proxy_set_header X-Authenticated-User "";
      proxy_set_header REMOTE_USER "";
      proxy_set_header X-Auth-Request-User "";
      proxy_set_header X-Forwarded-User "";
      proxy_set_header X-Remote-Groups "";
      proxy_read_timeout 60s;
    }

    # ---- LibreNMS native UI ----
    location / {
      set $ln_upstream nms-librenms;
      proxy_pass http://$ln_upstream:8000$request_uri;
      proxy_set_header Host $host:8443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      # Same strip set. Until the OIDC client is wired (Task 0.5 Step 4) the gateway
      # asserts NO identity, so LibreNMS keeps its own login form and a forged header
      # is inert. sso.static_level=0 keeps the unmapped case fail-closed.
      proxy_set_header X-Remote-User "";
      proxy_set_header X-Authenticated-User "";
      proxy_set_header REMOTE_USER "";
      proxy_set_header X-Auth-Request-User "";
      proxy_set_header X-Forwarded-User "";
      proxy_set_header X-Remote-Groups "";
      proxy_read_timeout 60s;
    }
  }
}
